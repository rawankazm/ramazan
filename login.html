<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <title>چوونەژوورەوە - سیستەمی DS</title>
    <style>
        :root {
            color-scheme: light;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #0f172a;
            background: #f1f5f9;
        }

        * { box-sizing: border-box; }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
            background: radial-gradient(circle at top, #e2e8f0, #f8fafc 60%);
        }

        main {
            width: min(100%, 420px);
            padding: 32px;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 20px 60px #0f172a1a;
        }

        h1 { margin: 0 0 8px; font-size: 25px; }
        p { color: #475569; line-height: 1.7; }
        form { display: grid; gap: 14px; margin-top: 24px; }
        label { display: grid; gap: 7px; font-weight: 600; }

        input {
            width: 100%;
            min-height: 46px;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font: inherit;
            text-align: right;
        }

        input:focus { outline: 3px solid #2563eb33; border-color: #2563eb; }

        button {
            min-height: 46px;
            border: 0;
            border-radius: 9px;
            background: #0f172a;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled { cursor: wait; opacity: .65; }
        #message { min-height: 24px; margin-bottom: 0; }
        #message[data-error="true"] { color: #b91c1c; }
        #message[data-error="false"] { color: #15803d; }
        #signOutButton { display: none; width: 100%; margin-top: 12px; background: #475569; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/login.js" defer></script>
</head>
<body>
    <main>
        <h1>چوونەژوورەوە</h1>
        <p>بۆ بەکارهێنانی سیستەم، بە هەژماری ڕێگەپێدراو بچۆ ژوورەوە.</p>
        <form id="loginForm">
            <label>
                ئیمەیڵ
                <input name="email" type="email" autocomplete="username" required>
            </label>
            <label>
                وشەی نهێنی
                <input name="password" type="password" autocomplete="current-password" required>
            </label>
            <button id="submitButton" type="submit">چوونەژوورەوە</button>
        </form>
        <button id="signOutButton" type="button">چوونەدەرەوە لەم ئامێرە</button>
        <p id="message" role="status" aria-live="polite"></p>
    </main>
</body>
</html>
